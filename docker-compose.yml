services:
  minio:
    image: elestio/minio:latest
    container_name: olist_minio
    profiles: [ "core", "full" ]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 5

  polaris:
    image: tabulario/iceberg-rest:latest
    container_name: olist_polaris
    profiles: [ "core", "full" ]
    restart: unless-stopped
    ports:
      - "${POLARIS_PORT:-8181}:8181"
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      CATALOG_WAREHOUSE: s3://lakehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
    depends_on:
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  trino:
    image: trinodb/trino:442
    container_name: olist_trino
    profiles: [ "core", "full" ]
    restart: unless-stopped
    ports:
      - "${TRINO_PORT:-8080}:8080"
    volumes:
      - ./etc/trino/catalog:/etc/trino/catalog:ro
    depends_on:
      - polaris
      - minio
    deploy:
      resources:
        limits:
          memory: 1536M

  spark-notebook:
    image: jupyter/pyspark-notebook:spark-3.5.0
    container_name: olist_spark_notebook
    profiles: [ "core", "full" ]
    restart: unless-stopped
    ports:
      - "${SPARK_PORT:-8888}:8888"
    environment:
      JUPYTER_ENABLE_LAB: "yes"
      NOTEBOOK_ARGS: "--NotebookApp.token='' --NotebookApp.password=''"
      PYTHONPATH: "/usr/local/spark/python:/usr/local/spark/python/lib/py4j-0.10.9.7-src.zip"
      POLARIS_URI: "http://polaris:8181"
      MINIO_ENDPOINT: "http://minio:9000"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      POSTGRES_HOST: ${POSTGRES_HOST:-aws-1-ap-southeast-2.pooler.supabase.com}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-postgres.iuvjhphnqpekptjzsifm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-olist-lakehouse}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - ./spark_jobs:/home/jovyan/work/spark_jobs
      - ./data_prep:/home/jovyan/work/data_prep
      - ./tests:/home/jovyan/work/tests
      - ./notebooks:/home/jovyan/work/notebooks
      - ./docs:/home/jovyan/work/docs
      - ivy_cache:/home/jovyan/.ivy2
    depends_on:
      - polaris
      - minio
    deploy:
      resources:
        limits:
          memory: 2048M

volumes:
  miniodata:
  ivy_cache:
